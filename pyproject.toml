[project]
name = "voice-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "pipecat-ai[google,local-smart-turn-v3,openai,runner,silero,webrtc]>=1.12.0",
    "python-dotenv>=1.2.4",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
