# voice-instinct settings. Copy to config.toml (the installer does this) and edit.

[assistant]
name = "Nova"                 # say the name to wake it: "Nova, what's on today?"
awake_timeout = 10            # seconds of quiet before the orb hides

[model]
provider = "gemini"           # gemini | openai | ollama
model = "gemini-3.8-flash"
api_key_env = "GEMINI_API_KEY" # the key itself goes in .env, never here
# base_url = "http://localhost:11434/v1"

[gui]
size = 128                    # orb size in pixels
position = "top-right"        # bottom-right | bottom-left | top-right | top-left | center

[paths]
models_dir = "~/.voice-instinct/models"
data_dir = "~/.voice-instinct"
workspace_dir = "~/.voice-instinct/workspace"

[agent]
permission_mode = "auto"      # Claude Code permission mode inside the sandbox
backend_timeout = 300
permission_timeout = 90

[debug]
# Record every step of an errand (web searches, pages, commands) in its folder (debug/steps.md), with a
# screenshot of each browser step that changes the page, and, if TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID are in .env, send each one to your own Telegram chat.
browser_steps = false

[stt]
# Speech-to-text, all local: nemotron (English, streaming, the default), nemotron-multilingual
# (40 languages, streaming), parakeet (the previous engine), or whisper-tiny / whisper-base /
# whisper-small. Pick a whisper engine if you sit far from the mic or the room is noisy: in testing
# whisper-base heard far-away speech best (7 of 7 vs Parakeet's 2 of 7). It decodes a phrase after you
# finish it, about 120 ms for base, so the reply starts a little later than with a streaming engine. Download: tiny 111 MB,
# base 198 MB, small 610 MB (about 290 ms per phrase, no better than base in testing).
# Re-run ./install.sh after changing it: it downloads only the engine chosen here (Nemotron is
# about 450 MB). Nemotron's weights are under the NVIDIA Open Model License.
engine = "nemotron"
# language = "en"  # the language Whisper listens for

[voice]
# Only your voice wakes it, after `cd backend && uv run enroll.py` (needs engine = "parakeet" or a whisper engine). Lower this
# if it misses you, raise it if others get through.
# threshold = 0.6
